<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested Div</title>
</head>
<body>
    <h1>Nested Div</h1>

    <hr>
    <div style="height:300px;width:100%;background-color:orange;float:left;">
        <!-- nested div -->
        <div style="height:100%;width:50%;float:left;background-color:purple"></div>
        <div style="height:100%;width:50%;float:left;background-color:cadetblue"></div>

    </div>

    <div style="height:300px;width:50%;float:left;background-color:aqua"></div>
    <div style="height:300px;width:50%;float:left;background-color:blue"></div>

</body>
</html>
