<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 style="float: left;">Layout Building</h1>

<!-- 1 box per row -->
    <div style="height:400px;width:100%;background-color:blueviolet"></div>

<!-- 2 boxes per row -->
    <div style="height:200px;width:50%;background-color:cadetblue;float:left"></div>
    <div style="height:200px;width:50%;background-color:chartreuse;float:left"></div>
<!-- 3 boxes per row -->
    <div style="height:200px;width:33.33%;float:left;background-color:brown"></div>
    <div style="height:200px;width:33.33%;float:left;background-color:darkorange"></div>
    <div style="height:200px;width:33.33%;float:left;background-color:greenyellow"></div>
<!-- 4 boxex per row -->
    <div style="height: 200px;width:25%;float:left;background-color:aquamarine"></div>
    <div style="height: 200px;width:25%;float:left;background-color:darkblue"></div>
    <div style="height: 200px;width:25%;float:left;background-color:brown"></div>
    <div style="height: 200px;width:25%;float:left;background-color:darkgreen"></div>

    <div style="height: 200px;width:80%;background-color:blueviolet;float:left"></div>
    <div style="height: 200px;width:20%;background-color:gold;float:left"></div>



</body>

</html>
