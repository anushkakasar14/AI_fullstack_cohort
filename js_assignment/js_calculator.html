<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <h2>Calculator</h2>


    <button onclick="calculate('+')">+</button>
    <button onclick="calculate('-')">-</button>
    <button onclick="calculate('*')">×</button>
    <button onclick="calculate('%')">%</button>
    <button onclick="calculate('/')">/</button>
    <br><br>

    <!-- Input 1: -->
    <input type="number" id="input1" placeholder="Enter first number">
    <br><br>

    <!-- Input 2: -->
    <input type="number" id="input2" placeholder="Enter second number">
    <br><br>

    

    <h3>Output:</h3>

    <p id="output"></p>


    <script>
    function calculate(operator) {

    let num1 = Number(document.getElementById("input1").value);
    let num2 = Number(document.getElementById("input2").value);

    let result;

    if (operator == "+") {
        result = num1 + num2;
    }

    else if (operator == "-") {
        result = num1 - num2;
    }

    else if (operator == "*") {
        result = num1 * num2;
    }

    else if (operator == "%") {
        result = num1 % num2;
    }

    else if (operator == "/") {
        result = num1 / num2;
    }

    document.getElementById("output").innerText = result;
}

    </script>
</body>
</html>
