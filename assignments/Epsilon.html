<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epsilon - eLearning LMS WordPress Theme Preview - ThemeForest</title>
    <link rel="shortcut icon" href="../assets/epsilon_icon.png" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .header {
            height: 70px;
            width: 100%;
            background-color: black;
            display: flex;


        }

        .head1 {
            height: 100%;
            width: 50%;
            /*  background-color: rgb(134, 219, 117);*/
            display: flex;
            align-items: center;
        }

        .head2 {
            height: 100%;
            width: 50%;

            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .head2 button {
            height: 35px;
            width: 120px;
            border-radius: 5px;
            border: none;
            background-color: #7AA93C;
            color: white;
        }

        /***********************************************************************************/
        .navbar {
            height: 80px;
            width: 100%;
            /* background-color: aqua;*/

            display: flex;

        }

        .nav1 {
            height: 100%;
            width: 30%;
            /*background-color: cadetblue;*/

            display: flex;
            justify-content: center;

        }

        .nav2 {
            height: 100%;
            width: 50%;
            /* background-color: rgb(206, 238, 62);*/

            display: flex;
            justify-content: center;

        }

        .nav2 ul {
            height: 100%;
            width: 100%;
            display: flex;
            gap: 50px;
            align-items: center;

        }

        .nav2 ul li {
            display: inline;


        }

        .nav2 ul li a {
            text-decoration: none;
            color: black;
        }

        .nav3 {
            height: 100%;
            width: 20%;
            /*  background-color: rgb(211, 42, 42);*/

            display: flex;
            gap: 30px;


        }

        .nav3 .btn2 {

            display: flex;

            align-items: center;


        }

        .nav3 .btn {
            height: 40px;
            width: 80px;
            background-color: red;
            color: white;
            border-radius: 5px;
            border: none;
        }

        .btn:hover {
            /* transition: all 2s ease-in 0.2s;*/
            background-color: blue;
            color: white;
        }

        /**************************************************************************************/
        .section {
            height: 420px;
            width: 100%;
            background-color: #004998;

            display: flex;
        }

        .section .sec1 {
            height: 100%;
            width: 50%;
            /*  background-color: chocolate;*/




        }

        .sec1 h1 {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 60px;
            font-weight: 400;
            line-height: 60px;
            color: white;
            margin-top: 20px;

        }

        .sec1 h4 {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 20px;
            font-weight: 400;
            line-height: 30px;
            color: white;

        }

        .sec_btn1 {
            height: 40px;
            width: 150px;
            border-radius: 5px;
            border: none;
            background-color: red;
            color: white;
        }

        .sec_btn2 {
            height: 40px;
            width: 150px;
            border-radius: 5px;
            border: 1px solid white;
            background-color: transparent;
            color: white;
            margin-left: 10px;
        }

        .section .sec2 {
            height: 100%;
            width: 50%;
            /* background-color: pink;*/

            display: flex;



        }

        .sec2 img {
            height: 400px;
            width: 380px;
        }

        .sec2 img:hover {
            transition: all 0.25s ease-out 0.25s;
            transform: scale(1.1);
        }

        /************************************************************************************************/
       
        
    </style>
</head>

<body>
    <main>
        <header class="header">
            <div class="head1"> <img src="../assets/main_logo.svg" style="height:100px;width:200px" alt=""></div>
            <div class="head2"><button class="button">Buy Now</button></div>
        </header>
        <!-- ************************************************************************** -->
        <nav class="navbar">
            <div class="nav1">
                <img src="../assets/epsilon_logo.png" style="height: 70px;width:200px;">
            </div>
            <div class="nav2">
                <ul>
                    <li><a href="">Home</a></li>
                    <li><a href="">Courses</a></li>
                    <li><a href="">Pages</a></li>
                    <li><a href="">Blog</a></li>
                    <li><a href="">Shop</a></li>


                </ul>
            </div>
            <div class="nav3">
                <img src="../assets/search_icon.png" style="height:20px;width:30px;margin-top:25px;">

                <div class="btn2"> <button class="btn">Login</button></div>
            </div>
        </nav>
        <!-- ************************************************************************************* -->
        <section class="section">
            <div class="sec1">
                <h1>Empowering <br>Knowledge. Shaping <br>the Future.</h1>
                <br>
                <h4>Advance your Epsilon journey through accredited online programs designed by leading educators. Learn
                    anywhere. Achieve more.</h4>
                <br>
                <br>
                <button class="sec_btn1">Apply For Admission</button>
                <button class="sec_btn2">Explore Program</button>
            </div>
            <div class="sec2">
                <img src="../assets/epsilon_bg.png" alt="">

            </div>
        </section>
        <!-- **************************************************************************** -->
       
    </main>
</body>

</html>
