<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myntra</title>
    <link rel="shortcut icon" href="../assets/myntra_logo.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .navbar {
            height:auto;
            width: 100%;
            background-color: aqua;

            display: grid;
            grid-template-columns: 0.3fr 2fr 1fr 0.7fr;

            position: fixed;

            border-bottom: 0.2px rgb(205, 204, 204) solid
        }

        .nav_sec1 {
            /* background-color: brown;*/
            display: flex;
            align-items: center;
            justify-content: center;

        }

        .nav_sec2 {


           background-color: pink;




        }

        .nav_sec2 ul {
            list-style: none;
            display: flex;
            align-items: center;
            justify-content: space-around;
            margin-top: 20px;

        }

        .nav_sec2 ul li a {
            text-decoration: none;
            color: black;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }





        .nav_sec3 {
         /*   background-color: yellow;*/

            display: flex;
            justify-content: center;
            align-items: center;


        }

        .nav_sec3 input {
            height: 30px;
            width: 280px;
            text-align: center;
            border: none;
            background-color: rgb(241, 241, 241);
            border-radius: 5px;


        }

        .nav_sec3 i {
            color: grey;
            position: relative;
            left: 28px;
        }

        .nav_sec4 {
           /* background-color: darkblue;*/
            
            display: flex;
            justify-content:space-evenly;
            align-items: center;
            font-size: 15px;
        }
        /***************************************************************/
        .main_section{
            height:520px;
            width: 100%;
            background-color: coral;
            padding: 20px 30px;


            display:grid;
            grid-template-columns: repeat(5,1fr);


        }
        .main_section .card_1{
           /* height:400px;
            width: 250px;*/
            background-color: aqua;
        }
        .main_section .card_2{
           /* height:400px;
            width: 250px;*/
            background-color:red;
        }
        .main_section .card_3{
           /* height:400px;
            width: 250px;*/
            background-color: pink;
        }
        .main_section .card_4{
           /* height:400px;
            width: 250px;*/
            background-color:yellow;
        }
        .main_section .card_5{
           /* height:400px;
            width: 250px;*/
            background-color:greenyellow;
        }
        

    </style>
</head>

<body>
    <main>
        <nav class="navbar">
            <div class="nav_sec1">
                <img src="../assets/myntra_logo.png" alt="">
            </div>
            <div class="nav_sec2">
                <ul>
                    <li><a href="">MENS</a></li>
                    <li><a href="">WOMENS</a></li>
                    <li><a href="">KIDS</a></li>
                    <li><a href="">HOME</a></li>
                    <li><a href="">BEAUTY</a></li>
                    <li><a href="">GENZ</a></li>


                </ul>
            </div>
            <div class="nav_sec3">
                <i class="fa fa-search"></i>
                <input type="text" placeholder="Search Here For More Items" name="" id="">

            </div>
            <div class="nav_sec4">
                <div class="icon1">
                    <i class="fa-regular fa-user"></i>
                    <br>
                    <span>Profile</span>
                </div>
                  <div class="icon2">
                    <i class="fa-regular fa-heart"></i>
                    <br>
                    <span>Wishlist</span>
                </div>
                  <div class="icon1">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <br>
                    <span>Bag</span>
                </div>

            </div>
        </nav>
        <!-- ***************************************************************** -->
         <section class="main_section">
            <div class="card_1"></div>
            <div class="card_2"></div>
            <div class="card_3"></div>
            <div class="card_4"></div>
            <div class="card_5"></div>

         </section>

       
    </main>
</body>

</html>
