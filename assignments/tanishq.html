<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0;
            padding: 0;
            box-sizing: border-box;

        }
        .bg{
            height: 100vh;
            width: 100%;
            background-color: aqua;
            float: left;

        }
        .bg_img{
            height: 100%;
            width: 100%;
            background:url(../assets/tanishq1.jpg) no-repeat center center/cover;
        }
        .bg_img .color{
             height: 100%;
            width: 100%;
            background-color: rgba(242, 240, 240, 0.8);


        }
        .card{
            height: 300px;
            width: 300px;
            background-color: chartreuse;
            border: 5px;
            float: left;
            margin-top: 150px;
            margin-left:400px;
            border-radius: 10px;
        }
        .bg2{
            height: 100%;
            width: 100%;
            background: url(../assets/pendent.jpg)  no-repeat center center/cover;
            border-radius: 10px;
        }

    </style>
</head>
<body>
    <main>
        <section>
            <!-- class name
             section or conatiner -->
            <div class="bg">
                <!-- section_bg  -->
                <div class="bg_img">
                    <!-- section_bg_effect -->
                    <div class="color">
                        <!-- card -->
                        <div class="card">
                            <!-- card_bg -->
                            <div class="bg2">
                                <img src="../assets/tanishq.svg"  style="height:100px;width:100px;margin-left:90px;">
                                <h3 style="text-align: center;">Welcome to Tanishq</h3>
                                <br>

                                <h4 style="text-align: center;">Lorem, ipsum dolor sit amet consectetur adipisicing elit. Nostrum, quaerat.</h4>
                                <br>
                                <br>

                                <button style="height: 50px;width:150px; margin-left:80px">Find My Discount</button>

                                
                                
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </section>
    </main>
</body>
</html>
