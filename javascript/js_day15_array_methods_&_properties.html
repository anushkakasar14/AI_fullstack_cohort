     <script>
        // use to perform multiple operations on Array

        // **********************************************************************
        // 1.length:it returns a length of an array
        const arr=[10,20,50,30,60]
        console.log(arr.length)




// *************************************************************************

        // 2.push/pop : Add/remove element at the end end
        // push(add)/pop(remove)
        
        // three points for every method:
        // 1.purpose and syntax
        // 2.it wil modify original array or not
        // 3.what it return

        // push:
        // add element to the last 
        // Original Array Modified-yes
        // it returns new length of an Array

        const arr2=["rect","node","api","aws"]
        console.log(arr2)
        arr2.push("nextjs")
        console.log(arr2.push("Python")) //6
        

        // pop:
        // remove last index of array
        // original modified-yes
        // returns a removed element

        const arr3=[1,2,3,4,5,6]
        console.log(arr3)
        arr3.pop
        console.log(arr3.pop())


        // ****************************************************************************
        // unshift:adding element to starting index of array
        // modify original element
        // it returns a new length

        const role=["admin","superadmin","user"]
        console.log(role)
        role.unshift("department")
        console.log(role)
        console.log(role.unshift())

        // shift:remove element to starting index of array
        // modify original element
        // it returns a removed element

        const arr5=[100,200,300,500,600]
        console.log(arr5)
        arr5.shift()
        console.log(arr5)

        console.log(arr5.shift())



        // ********************************************************************
        // splice:use to remove or add multiple elements form array
        // syntax-arr.splice(start,count)
        // original Array modified- yes
        //it returns-new array 

        const fruits=["apple","banana","mango","orange","pineapple","dragonefruit"]
        // console.log(fruits)
        // fruits.splice(0,2)
        // fruits.splice(3)
        // fruits.splice(0)



        // console.log(fruits.splice(2,3))
        fruits.splice(1,3,"custurdapple","watermelon") //add this to at given index
        console.log(fruits)


        


        
     </script>
