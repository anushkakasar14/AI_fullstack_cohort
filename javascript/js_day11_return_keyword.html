<body>
    
    <h1>
        Return Keyword in JavaScript
    </h1>

    <script>
        // return keyword is used to return data outside the function
        // return value itself

        // it stops the function execution after returning the value


       
        

        // interview question
        function Demo3(name,role)
        {
            console.log("hello A");
            return name;
            console.log("hello B");

        }
        Demo3("John","Admin");




        // withdraw and deposit
        let amt=prompt("Enter the amount to withdraw");

        function withdraw(amount)
        {
            console.log("Withdrawn amount is: "+amount);
            return amount;
    
        }
        
        let amt2=prompt("Enter the amount to deposit");
         function deposit(amount)
         {
            console.log("Deposited amount is: "+amount);
            return amount;
         }
         

        let balance=deposit(amt2)-withdraw(amt);
        console.log("Balance is: "+balance);



        
    
    </script>
