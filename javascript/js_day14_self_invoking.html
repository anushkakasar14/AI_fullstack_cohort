<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- IIFE-Immediate Invoking Funciton Expression -->
     <!-- self invoking-calling itself -->
      <!-- syntax:
      (
        function()
        {}
      )() -->
     <script>
        // ex1:
        (
            function(){
                console.log("hello IIFE")
            }
        )()
        

        // ex2:
        (
            function()
            {
                console.log("hello Anushka")
            }
        )()

     </script>
    
</body>
</html>
