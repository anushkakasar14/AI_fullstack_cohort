    <script>

        // let A = () => {

        // prime no.

        let num = Number(prompt("Enter a number"));
        function prime(num) {

            if (num <= 1)
                return false;

            for (let i = 2; i < num; i++) {
                if (num % i == 0)
                    return false;//return keyword
            }

            return true;
        }
// ternary operator
        document.write(prime(num) ? "Prime Number<br>" : "Not Prime Number<br>");





        // ***********************************************************************
        // ATM machine

        let pin = Number(prompt("Enter Pin:"));
        function checkpin(pin) {
            if (pin == 12345)

                return true;
            else
                return false;

        }
        if (checkpin(pin)) {
            console.log("correct pin"); 

            let balance = 10000;
            let amt = Number(prompt("Enter the Withdraw Amount:"))
            if (balance >= amt) {
                balance = balance - amt;
                document.write("withdraw Successful:"+amt );

                
                document.write("</br>Remaining Balance: " + balance );
            } else {
                document.write("Insufficient Balance");
            }

        } else {
            document.write("Wrong PIN");
        }


        








    </script>
