<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Ways to write function in JS</h1>
    <script>
        // Normal function
        // Function expression
        // Anonymous function
        // FAT Arrow function /lambda function /Arrow function
        // Self Invoking function /IIFE function (Immediately invoked function expression)
        // Sync /Async function
        // Callback function

// ************************************************************************
        // 1. normal function:A normal function is declared using the function keyword and has a name.
        function Demo()
        {
            console.log("Hello Normal function");
        }
        Demo();


// ********************************************************************************
        //2. Function variable expression:A function expression means storing a function inside a variable.
        let Demo2=function Demo()
        {
            console.log("Hello Function variable Expression");
        }
        Demo2();

// ************************************************************************
        //3. Anonymus function:function that does not have any name.

        const Demo3=function(x=0,y=0,z=0,...rest)
        {
            return x+y+z;
        }
        console.log(Demo3(1000,3000,5000));

// ***************************************************************************
        // 4.Arrow Function/lambda function/FAT Arrow function
        // ES6 feature
        // Modern way to write function
        // we can write function in single line
        // no need to bind 'this' keyword
        // An arrow function is a shorter syntax for writing functions.

        const Demo4=()=>{
            console.log("Hello welcome to Arrow Function/lambda function/FAT Arrow function ")
        }
        Demo4();

        // 
        const Demo5=()=>console.log("Hello Arrow Function")
        Demo5();

        // when we return something we need to pass{}
        const Demo6=()=>{return "Hello arrow function with return keyword"}
        Demo6();

        // without()
        const Demo7=name=>{console.log('hello ${name}')}
        Demo7("Anushka");



// *********************************************************************
// 🔥 All Four Compared:

// Type	                  Example	                  Main idea

// Normal function	      function add(){}            Function declaration
// Function expression    const add = function() {}   Function stored in variable
// Anonymous function	  function() {}	              Function has no name
// Arrow function	      const add = () => {}	      Shorter function syntax


// **********************************************************************************
// Hoisting:
// Hoisting is a JavaScript behavior where declarations are processed before the code is executed.
// declaration are hoisted (var/let/const)
// intialization are not hoisted(let,const)



// initialization are not hoisted for let /const
// a=20;   TDZ              
// console.log(a)           
// let a;        



// ** Function Hoisting:
// normal function declaration are hoisted
// can be call first before declaration.

A();
function A(){
    console.log("Hello Normal Function A");
}



// **arrow function are not hoisted
// first declare and then call
let demo=()=>{
    console.log("hello Arrow Funciton")
}
demo()


    </script>
</body>
</html>
