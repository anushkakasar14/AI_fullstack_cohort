// IMP Point for Interview
// REST PARAMETERS: ES6 feature modern JS feature

// indicated by ... (three dots) before the parameter name
// when we passes extra additional argumentss
// The rest parameter allows a function to accept any number of arguments and collect them into an array.
// it returns rest value in an array format
// 
let sum=0;
function addition(a=0,b=0,c=0, ...input)
{
    console.log(a+b+c)
    console.log(input); //returns rest values in an array format
    for(let x in input)
    {
        // console.log(x); returns rest values one by one
        sum+=x
    }
}
// addition();
addition(100,200,300);
addition(1000,2000,3000,40,50,60);
