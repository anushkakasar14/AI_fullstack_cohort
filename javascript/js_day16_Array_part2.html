        // *************************************************************************
        // find index of an element
        // indexOf: return starting index of element
        const courses=["js","react","python","nodejs","java","aiml","genai"]
        console.log(courses.indexOf("js"));

// ****************
        // lastIndexOf:returns last index of an element
        console.log(courses.lastIndexOf("java"));

// *********************
        // include:check element is present or not
        // true or false
        console.log(courses.includes("genai"))


// ******************
        // at
        console.log(courses.at(2))


// **********************

        console.log(arr1+arr2)
