<!DOCTYPE html>
<html lang="en">

<head>

<body>
    <!-- methods and properties -->
    <!-- to perform operations -->
    <script>

        // 1.Object.keys():
        // use to extract key from given objects
        // it returns object keys in an array format
        const obj = {
            id: "1",
            name: "Anushka",
            skill: ["react", "nextjs"],
            ctc: "20lpa",
            role: "AI Engineer"
        }
        console.log(obj)
        console.log(Object.keys(obj))


        //2. Object.values()
        // it returns value from given object
        // in array format

        console.log(Object.values(obj))


        //3. Object.entries()
        // it returns both key:value in form of array
        console.log(Object.entries(obj))


// iterate Object
        for (let key of Object.keys(obj)) {
            console.log(key);
        }

         for (let values of Object.values(obj)) {
            console.log(values);
        }

         for (let x of Object.entries(obj)) {
            console.log(x);
        }

       



        //4. Object.freeze():
        // it freeze the object
        // i.e we cannot update object properties and values once it is defined
        // it doesn't allow to modified object

        const obj2={
            id:"1",
            name:"ABCD",
            role:"Developer"

        }




        // update value in Object
         obj2.role="Data Engineer"




        //add new value
        obj2.age=30; 



        // PREVENT the mofidication of existing properties attributes and values
        // and prevent the addition of new properties





        console.log(obj2)


        //5. Object.seal()
        // it seal the object
        




        //6. Object.isExtensible()
        // whether we can add or update the value 

        console.log(Object.isExtensible(obj2))





        // 7.assign()
        // copy one object value inside into another object

        const obj3={age:20,role:"Engineer"};
        const obj4={address:"pune",ctc:"12LPA"}

        console.log(Object.assign(obj4,obj3))




        // Object.call()
        // Object.bind()
        // Object.apply()






    </script>
</body>
