<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        .heading {
            height: 100px;
            width: 100%;
            background-color: aqua;
            color: blueviolet;

            /*hexcode*/
            background-color: #ff0000;
            background-color: #000000;
            background-color: #00ff00;

            /*rgb*/
            background-color: rgb(0, 0, 0);
            background-color: rgb(0, 255, 0);
            background-color: rgb(0, 0, 255);
            background-color: rgb(255, 255, 255);
            background-color: rgb(120, 205, 220);

            /*rgba-range from(0to1)*/
            background-color: rgba(120, 0, 0, 0.5);

            /*hsl(hue saturation lightness)
            hue-color (0-360)
            saturation-darkness/opacity (0-100%)
            lightness-balckish/whitish (0-100%)*/
            background-color: hsl(110, 80%, 80%);
        }


        /*background-image*/
        /*background: url(path) background-repeat background-position background-size;
            
            1.url()
            2.background-repeat:no-repeat or repeat or repeat-x or repeat-y
            3.background-position:centre center or top center or top left or center right or center right
            4.background-size:cover
            */
        .section {
            height: 600px;
            width: 100%;
            float: left;
            background: url(../assets/home.jpg) no-repeat center center/cover;
            background-attachment: fixed;
        }

        .section h1 {
            color: blue;
            margin-left: 100px;
            padding-top: 50px;

        }

        .section .button {}
    </style>
</head>

<body>
    <h1>color in CSS</h1>
    <div class="heading">
        <h1>COLOR IN CSS</h1>


    </div>
    <div class="section">
        <h1>Welcome tO modern CSS</h1>
        <button>Register Now</button>
    </div>
    <div style="height:400px;"></div>
</body>

</html>
