<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .navbar {
            height: 100px;
            width: 100%;
            background-color: darkblue;

        }

        .container {
            height: 100vh;
            width: 100%;
            background-color: rgb(222, 255, 212);

            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        .sec1 {
            height: 200px;
            width: 200px;
            background-color: rgb(0, 249, 249);

        }

        .sec2 {
            height: 200px;
            width: 200px;
            background-color: rgb(219, 11, 11);

        }

        .sec3 {
            height: 200px;
            width: 200px;
            background-color: rgb(219, 48, 162);

        }

        /*mobile screen */
        @media screen And (max-width:767px) {
            .navbar {
                background-color: darkorange;
            }

            .container {
                flex-direction: column;
            }

            .sec1,
            .sec2,
            .sec3 {
                width: 150px;
                height: 300px;
            }
        }

        /*tablet screen*/
        @media screen And (min-width:768px) {
            .navbar {
                background-color: darkseagreen;
            }

            .container {
                flex-direction: column;
                background-color: violet;
            }

            .sec1,
            .sec2,
            .sec3 {
                width: 150px;
                height: 150px;
            }
        }

        /*Desktop Screen */
        @media screen And (min-width:1024px) And (max-width:1280px) {
            .navbar {
                background-color: rgb(43, 75, 252);
            }

            .container {
                flex-direction: row;

                background-color: violet;
            }

            .sec1,
            .sec2,
            .sec3 {
                width: 150px;
                height: 150px;
            }
        }
    </style>
</head>

<body>
    <main>
        <nav class="navbar"></nav>
        <section class="container">
            <div class="sec1"></div>
            <div class="sec2"></div>
            <div class="sec3"></div>
        </section>
    </main>
</body>

</html>
