<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            height: 550px;
            width: 100%;
            background-color: cornflowerblue;
            float: left;
           /* transform: translate(50px, 20px);*/
          /* transform: rotate(45deg);*/
          /*transform: scale(1.2);*/
          transform: scale(1.05);
         
        }
        .section1{
            height:200px;
            width: 200px;
            background-color: chartreuse;
            float: left;
            box-shadow: 3px 4px 10px blue;
            transition:0.3s
           
           
        }
        .section1:hover{
            background-color: pink;
        }
        .section1 h3{
            text-shadow:2px 3px 2px rgb(93, 93, 210);
        }
        .section2{
            height: 200px;
            width: 200px;
            background-color: rgb(16, 132, 25);
            float: left;
        }
        .section3{
            height:200px;
            width:200px;
            background-color: rgb(226, 51, 51);
            float: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="section1">
            <h3>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Nam, provident!</h3>
        </div>
        <div class="section2"></div>
        <div class="section3"></div>
    </div>
</body>
</html>
